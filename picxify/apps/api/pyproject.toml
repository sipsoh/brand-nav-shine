[project]
name = "picxify-api"
version = "0.1.0"
description = "Picxify API and worker service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "celery>=5.4",
    "redis>=5.0",
    "boto3>=1.34",
    "python-multipart>=0.0.9",
    "jsonschema>=4.22",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "duckdb>=1.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "openai>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
