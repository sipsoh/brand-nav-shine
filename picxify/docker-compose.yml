services:
  postgres:
    image: postgres:16-alpine
    container_name: picxify-postgres
    environment:
      POSTGRES_USER: picxify
      POSTGRES_PASSWORD: picxify
      POSTGRES_DB: picxify
    ports:
      - "5432:5432"
    volumes:
      - picxify_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picxify -d picxify"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: picxify-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - picxify_redis:/data

  minio:
    image: minio/minio:latest
    container_name: picxify-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - picxify_minio:/data

volumes:
  picxify_postgres:
  picxify_redis:
  picxify_minio:
